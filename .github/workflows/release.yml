name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

# The steps of zotero-plugin-dev's release-plugin workflow, with the
# remarkable-annotations submodule built before installing (see
# .github/actions/setup). Back to the reusable workflow once the package is
# on npm.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: npm run build
      - name: Release to GitHub
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: sleep 1s
      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
