name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      # actions/checkout first: the local setup action lives in the repository
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      # actions/checkout first: the local setup action lives in the repository
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      # actions/checkout first: the local setup action lives in the repository
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Setup
        uses: ./.github/actions/setup
      - run: npm run test
